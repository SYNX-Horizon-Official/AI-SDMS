version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - ai-sdms

  backend:
    build: ./backend
    command: sh -c "npm install && node src/index.js"
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/ai-sdms
      - FILE_UPLOAD_PATH=/srv/uploads
    volumes:
      - ./backend:/usr/src/app
      - ./uploads:/srv/uploads
      - ./temp_uploads:/usr/src/app/temp_uploads
    depends_on:
      - mongo
    networks:
      - ai-sdms

  frontend:
    build: ./frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    volumes:
      - ./frontend:/usr/src/app
    networks:
      - ai-sdms

volumes:
  mongo-data:

networks:
  ai-sdms:
    driver: bridge
