version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ai-sdms-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-sdms-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-sdms-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/ai-sdms?authSource=admin
      JWT_SECRET: your_jwt_secret_key_here
      OLLAMA_BASE_URL: http://ollama:11434
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      - ./backend/src:/app/src
    networks:
      - ai-sdms-network
    command: npm start

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-sdms-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - ai-sdms-network
    command: npm run dev

  ollama:
    image: ollama/ollama:latest
    container_name: ai-sdms-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-sdms-network

volumes:
  mongodb_data:
  ollama_data:

networks:
  ai-sdms-network:
    driver: bridge
